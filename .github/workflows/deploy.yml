name: Deploy Prism Playground to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prism-playground
        uses: actions/checkout@v7

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Cache WASI SDK & Wasm Builds
        id: cache-wasi
        uses: actions/cache@v6
        with:
          path: |
            vendor/wasi-sdk
            build/wasm_cache
          key: wasi-sdk-33.0-linux-x86_64-${{ hashFiles('src/instrument.rb', 'src/trace_runtime.c', 'src/trace_runtime.h', 'src/trace_main.c') }}
          restore-keys: |
            wasi-sdk-33.0-linux-x86_64-
            wasi-sdk-33.0-linux-x86_64

      - name: Build Prism Playground (Presets + WebAssembly + HTML)
        run: ./scripts/build.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
