name: Deploy Prism Loupe to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    # Run once every evening (22:00 UTC) to pick up new ruby/prism main commits and releases
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prism-loupe
        uses: actions/checkout@v7

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Cache WASI SDK
        id: cache-wasi
        uses: actions/cache@v6
        with:
          path: vendor/wasi-sdk
          key: wasi-sdk-33.0-linux-x86_64

      - name: Cache Compiled Prism Wasm Modules
        id: cache-wasm
        uses: actions/cache@v6
        with:
          path: build/wasm_cache
          key: prism-wasm-cache-${{ hashFiles('src/instrument.rb', 'src/trace_runtime.c', 'src/trace_runtime.h', 'src/trace_main.c', 'src/prism_xallocator.h') }}-${{ github.run_id }}
          restore-keys: |
            prism-wasm-cache-${{ hashFiles('src/instrument.rb', 'src/trace_runtime.c', 'src/trace_runtime.h', 'src/trace_main.c', 'src/prism_xallocator.h') }}-

      - name: Build Prism Loupe (WebAssembly + HTML)
        run: ./scripts/build.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
